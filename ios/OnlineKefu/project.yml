name: OnlineKefu
options:
  bundleIdPrefix: com.xianyu
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    # 未签名构建：TrollStore 安装后会用自己的 ldid 重新签名
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
    ENABLE_BITCODE: "NO"

targets:
  OnlineKefu:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    # ⚠️ XcodeGen 没有 target 级 `resources:` 这个键（写了会被忽略 → 产物里没有 Assets.car，
    #  App 装上图标是白的）。资源必须用 sources + buildPhase: resources 声明。
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
        buildPhase: resources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: 在线客服
        CFBundleName: 在线客服
        CFBundleShortVersionString: "1.7.3"
        CFBundleVersion: "23"
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        # 后端是 http://内网IP:9000，必须放开 ATS，否则请求直接被系统拦掉
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: 需要访问局域网内的闲鱼客服服务
        NSMicrophoneUsageDescription: 用于语音转文字，方便快速回复买家
        NSSpeechRecognitionUsageDescription: 用于把你说的话转成文字填入输入框
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xianyu.onlinekefu
        MARKETING_VERSION: "1.7.3"
        CURRENT_PROJECT_VERSION: "23"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

schemes:
  OnlineKefu:
    build:
      targets:
        OnlineKefu: all
    run:
      config: Debug
    archive:
      config: Release
